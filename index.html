<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule Countdown Timer</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,'Noto Sans KR',sans-serif;background:#09090b;color:#fff}body{overflow:hidden}.app{height:100vh;position:relative;background:radial-gradient(circle at center,rgba(255,255,255,.16),transparent 55%)}#cards{height:100vh;overflow:auto;padding:12px 12px 112px;display:flex;flex-direction:column;gap:12px}.card{position:relative;border:2px solid #71717a;box-shadow:0 10px 25px #0005;min-height:calc((100dvh - 132px)/1);display:flex;flex-direction:column;overflow:hidden}.card h2{margin:14px 18px;font-size:clamp(24px,3.6vw,36px);line-height:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:30px;z-index:2}.card h2 a{color:inherit;text-decoration:none}.card h2 a:hover{text-decoration:underline}.delx{position:absolute;right:12px;top:12px;border:1px solid #a1a1aa;background:#fffbd9;color:#52525b;width:22px;height:22px;border-radius:50%;font-weight:900;cursor:pointer;z-index:3}.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:20px}.count{font-weight:1000;font-size:clamp(48px,13vw,150px);letter-spacing:-.075em;line-height:1;white-space:nowrap}.days{position:absolute;right:16px;bottom:15px;border:1px solid #a1a1aa;background:#ffffffe5;border-radius:999px;padding:6px 12px;color:#52525b;font-weight:900;font-size:clamp(12px,1.7vw,18px)}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:46px 16px 18px;background:linear-gradient(to top,#09090b,#09090bea,transparent)}.bottom button{height:56px;border-radius:999px;padding:0 26px;border:1px solid #ffffff4d;background:#ffffff1a;color:#fff;font-size:16px;font-weight:900;cursor:pointer}.bottom .primary{background:#fff;color:#18181b;border:none}.overlay{position:fixed;inset:0;z-index:50;background:#000b;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{width:min(94vw,580px);max-height:90vh;overflow:auto;background:#fffffff7;color:#18181b;border-radius:26px;padding:26px;box-shadow:0 25px 60px #0008}.modalHead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.modal h1{margin:0;font-size:26px}.muted{color:#71717a;font-size:14px;margin:8px 0 22px}.close{border:0;background:transparent;font-size:28px;font-weight:900;cursor:pointer}label{display:block;font-size:14px;font-weight:900;margin:16px 0 7px}input,select,textarea{width:100%;border:1px solid #d4d4d8;border-radius:15px;padding:12px 14px;font:inherit;background:#fff}.timeRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.todayBtn{margin-top:8px;border:0;border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer}.submit{width:100%;height:52px;margin-top:22px;border:0;border-radius:16px;background:#18181b;color:#fff;font-size:16px;font-weight:900;cursor:pointer}.err{color:#b91c1c;font-size:13px;font-weight:700;margin-top:10px}.editItem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #e4e4e7}.editTitle{font-weight:900;overflow:hidden;text-overflow:ellipsis}.editActions{display:flex;gap:7px}.editActions button{border:1px solid #d4d4d8;background:#fff;border-radius:10px;padding:7px 10px;font-weight:800;cursor:pointer}.danger{background:#b91c1c!important;color:#fff!important;border:0!important}.confirmText{font-size:17px;line-height:1.5;margin:22px 0}.rowBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rowBtns button{height:48px;border-radius:14px;border:1px solid #d4d4d8;font-weight:900;cursor:pointer}.pulse{animation:pulse 1s ease-in-out infinite}.shake{animation:pulse 1s ease-in-out infinite,shake .4s ease-in-out infinite}.final{animation:blink .28s linear infinite,shake .28s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.02)}}@keyframes shake{20%{transform:translateX(-2px)}40%{transform:translateX(2px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}@keyframes blink{50%{opacity:.45}}@media(max-width:700px){#cards{padding:10px 10px 175px}.bottom{padding-top:32px}.bottom button{height:50px;padding:0 18px;font-size:14px}.card h2{margin:12px 14px}.count{font-size:clamp(42px,15vw,100px)}}
</style></head><body><div class="app"><div id="cards"></div><div class="bottom" id="bottom"><button class="primary" onclick="openForm()">＋ 일정 추가</button><button onclick="openEditList()">일정 편집</button></div></div>
<div class="overlay" id="formOv"><div class="modal"><div class="modalHead"><div><h1 id="formHead">일정 타이머</h1><p class="muted" id="formSub">일정과 시간을 입력하면 남은 시간이 크게 표시됩니다.</p></div><button class="close" onclick="closeForm()">×</button></div><form id="form"><label>일정</label><input id="title" placeholder="예: JPYC 온보딩 회의" required><label>날짜</label><input id="date" type="date" required><button type="button" class="todayBtn" onclick="setToday()">오늘</button><label>시간</label><div class="timeRow"><select id="hour"></select><select id="minute"></select></div><label>미팅 URL / 초대문</label><textarea id="url" rows="4" placeholder="Google Meet 초대문 전체를 붙여 넣어도 됩니다."></textarea><div class="err" id="formErr"></div><button class="submit" id="submitBtn">일정 저장</button></form></div></div>
<div class="overlay" id="editOv"><div class="modal"><div class="modalHead"><div><h1>일정 편집</h1><p class="muted">수정하거나 삭제할 일정을 선택하세요.</p></div><button class="close" onclick="closeOv('editOv')">×</button></div><div id="editList"></div></div></div>
<div class="overlay" id="delOv"><div class="modal"><h1>일정 삭제</h1><div class="confirmText" id="delText"></div><div class="rowBtns"><button onclick="closeOv('delOv')">취소</button><button class="danger" onclick="confirmDelete()">삭제</button></div></div></div>
<script>
const SUP='https://bxeuvtjqdsnxogajyfok.supabase.co/rest/v1/schedules',KEY='sb_publishable_elO4Nvzk62dlfYorADrA7A_c7AFBpNN',CACHE='schedule-countdown-timer-v1';const HDR={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};let schedules=[],editing=null,deleting=null;const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const hours=[...Array(15)].map((_,i)=>pad(i+9)).concat([...Array(9)].map((_,i)=>pad(i)));$('hour').innerHTML=hours.map(x=>`<option>${x}</option>`).join('');$('minute').innerHTML=['00','15','30','45'].map(x=>`<option>${x}</option>`).join('');
function id(){return crypto.randomUUID?crypto.randomUUID():'s-'+Date.now()+'-'+Math.random().toString(36).slice(2)}function extract(v){v=String(v||'').trim();if(!v)return'';let m=v.match(/https:\/\/meet\.google\.com\/[a-z0-9-]+/i);if(m)return m[0];if(/^https?:\/\//i.test(v))return v;let u=v.match(/https?:\/\/[^\s<>]+/i);return u?u[0].replace(/[),.;]+$/,''):'https://'+v}function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function sort(){schedules.sort((a,b)=>a.targetTime-b.targetTime)}function cache(){localStorage.setItem(CACHE,JSON.stringify(schedules))}function fromRow(x){return{id:String(x.id),title:String(x.title||''),targetTime:Number(x.target_time),url:String(x.url||'')}}function toRow(x){return{id:x.id,title:x.title,target_time:x.targetTime,url:x.url||'',updated_at:new Date().toISOString()}}async function req(url,opt={}){let r=await fetch(url,{...opt,headers:{...HDR,...(opt.headers||{})},cache:'no-store'});if(!r.ok)throw Error('Supabase '+r.status+': '+await r.text());return r.status===204?null:r.text().then(t=>t?JSON.parse(t):null)}
async function load(){try{let rows=await req(SUP+'?select=id,title,target_time,url&order=target_time.asc');schedules=(rows||[]).map(fromRow);sort();cache();render();if(!schedules.length)openForm()}catch(e){console.error(e);try{schedules=JSON.parse(localStorage.getItem(CACHE)||'[]')}catch{}sort();render()}}
function remain(ms){let d=ms-Date.now();if(d<=0)return{done:true,days:0,time:'시간 완료'};let t=Math.floor(d/1000),days=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),s=t%60;return{done:false,days,time:pad(h)+':'+pad(m)+':'+pad(s)}}function dayOffset(ms){let n=new Date(),t=new Date(ms),a=new Date(n.getFullYear(),n.getMonth(),n.getDate()),b=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((b-a)/86400000)}function styleFor(x){let r=x.targetTime-Date.now(),d=dayOffset(x.targetTime);if(r<=0)return['#000','#fff',''];if(d===0&&r<=10800000)return['#B21016','#fff',r<=10000?'final':r<=300000?'shake':r<=600000?'pulse':''];if(d===0)return['#FFFA99','#000',''];return['#BFBFBF','#52525b','']}function minH(){let n=Math.min(Math.max(schedules.length,1),5),g=(n-1)*12;return`calc((100dvh - 132px - ${g}px) / ${n})`}
function render(){sort();$('bottom').style.display=schedules.length?'flex':'none';$('cards').innerHTML=schedules.map(x=>{let r=remain(x.targetTime),st=styleFor(x);return`<section class="card ${st[2]}" style="min-height:${minH()};background:${st[0]};color:${st[1]}"><h2>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>`:esc(x.title)}</h2><button class="delx" onclick="askDelete('${x.id}')">×</button><div class="center"><div class="count">${r.time}</div>${!r.done?`<div class="days">${r.days} ${r.days===1?'Day':'Days'}</div>`:''}</div></section>`}).join('')}
function setToday(){let d=new Date();$('date').value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function nearestMin(m){return m<8?'00':m<23?'15':m<38?'30':'45'}function openForm(item=null){editing=item?item.id:null;$('formHead').textContent=item?'일정 수정':'일정 타이머';$('formSub').textContent=item?'기존 일정 정보를 수정합니다.':'일정과 시간을 입력하면 남은 시간이 크게 표시됩니다.';$('formErr').textContent='';if(item){let d=new Date(item.targetTime);$('title').value=item.title;$('date').value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());$('hour').value=pad(d.getHours());$('minute').value=nearestMin(d.getMinutes());$('url').value=item.url||''}else{$('form').reset();setToday();$('hour').value='09';$('minute').value='00'}$('formOv').classList.add('show')}function closeForm(){if(!schedules.length)return;$('formOv').classList.remove('show');editing=null}function closeOv(id){$(id).classList.remove('show')}
$('form').onsubmit=async e=>{e.preventDefault();let title=$('title').value.trim(),date=$('date').value,h=$('hour').value,m=$('minute').value;if(!title||!date){$('formErr').textContent='일정 제목과 날짜를 입력해 주세요.';return}let target=new Date(`${date}T${h}:${m}`).getTime();if(Number.isNaN(target))return;let item={id:editing||id(),title,targetTime:target,url:extract($('url').value)};let prev=[...schedules];let i=schedules.findIndex(x=>x.id===item.id);if(i>=0)schedules[i]=item;else schedules.push(item);sort();cache();render();$('formOv').classList.remove('show');editing=null;try{await req(SUP+'?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(toRow(item))})}catch(err){alert('온라인 저장 실패: '+err.message);schedules=prev;render()}};
function openEditList(){$('editList').innerHTML=schedules.map(x=>`<div class="editItem"><div class="editTitle">${esc(x.title)}</div><div class="editActions"><button onclick="editOne('${x.id}')">수정</button><button class="danger" onclick="askDelete('${x.id}')">삭제</button></div></div>`).join('');$('editOv').classList.add('show')}function editOne(i){let x=schedules.find(v=>v.id===i);closeOv('editOv');if(x)openForm(x)}function askDelete(i){deleting=schedules.find(v=>v.id===i)||null;if(!deleting)return;$('delText').textContent=`“${deleting.title}” 일정을 삭제할까요?`;$('delOv').classList.add('show')}async function confirmDelete(){if(!deleting)return;let x=deleting,prev=[...schedules];schedules=schedules.filter(v=>v.id!==x.id);cache();render();closeOv('delOv');closeOv('editOv');deleting=null;try{await req(SUP+'?id=eq.'+encodeURIComponent(x.id),{method:'DELETE',headers:{Prefer:'return=minimal'}});if(!schedules.length)openForm()}catch(e){alert('온라인 삭제 실패: '+e.message);schedules=prev;render()}}
load();setInterval(render,1000);setInterval(load,60000);
</script></body></html>
