<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule Countdown Timer</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;font-family:Arial,'Noto Sans KR',sans-serif;color:#111}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{font-size:26px;margin:0}.tools{display:flex;gap:8px;flex-wrap:wrap}button,.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:#111;color:#fff}.secondary{background:#fff;color:#111;border:1px solid #ddd}.grid{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}.cards{display:grid;gap:12px}.card{border-radius:14px;padding:18px;box-shadow:0 2px 8px #0001}.title{font-size:20px;font-weight:800;margin-bottom:8px}.time{font-size:14px;opacity:.8}.count{font-size:28px;font-weight:900;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button,.actions a{font-size:13px;padding:8px 11px;border-radius:7px;text-decoration:none;background:#fff;color:#111;border:1px solid #0002;font-weight:700}.panel{background:#fff;padding:18px;border-radius:14px;box-shadow:0 2px 8px #0001}.panel h2{margin:0 0 14px;font-size:18px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid #d6d6d6;border-radius:8px;padding:10px;font:inherit;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.submit{width:100%;margin-top:16px;background:#2563eb}.cancel{width:100%;margin-top:8px;background:#777;display:none}.status{font-size:13px;margin-bottom:12px;color:#666}.empty{background:#fff;padding:40px;text-align:center;border-radius:14px;color:#777}@media(max-width:760px){.wrap{padding:16px}.grid{display:flex;flex-direction:column}.cards{width:100%}.panel{width:100%;order:2}.top{align-items:flex-start;gap:12px;flex-direction:column}.count{font-size:24px}}@keyframes pulse{50%{transform:scale(1.01);filter:brightness(.92)}}.urgent{animation:pulse 1s infinite}</style></head><body><div class="wrap"><div class="top"><h1>Schedule Countdown Timer</h1><div class="tools"><button class="secondary" onclick="exportTxt()">TXT 내보내기</button><label class="btn secondary" style="margin:0">TXT 불러오기<input id="file" type="file" accept=".txt,.json" hidden></label></div></div><div id="status" class="status">온라인 일정을 불러오는 중입니다...</div><div class="grid"><div id="cards" class="cards"></div><div class="panel"><h2 id="formTitle">일정 등록</h2><form id="form"><label>일정 이름</label><input id="title" required placeholder="예: 파트너 미팅"><label>날짜</label><input id="date" type="date" required><label>시간</label><div class="row"><select id="hour"></select><select id="minute"></select></div><label>미팅 URL / 초대문</label><textarea id="url" rows="4" placeholder="Google Meet 초대문 전체를 붙여 넣어도 됩니다."></textarea><button class="submit" id="submit">일정 등록</button><button type="button" class="cancel" id="cancel" onclick="resetForm()">수정 취소</button></form></div></div></div><script>const S='https://bxeuvtjqdsnxogajyfok.supabase.co',K='sb_publishable_elO4Nvzk62dlfYorADrA7A_c7AFBpNN',API=S+'/rest/v1/schedules',H={'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json'};let schedules=[],editing=null;const $=id=>document.getElementById(id);const hours=[...Array(15)].map((_,i)=>String(i+9).padStart(2,'0')).concat([...Array(9)].map((_,i)=>String(i).padStart(2,'0')));$('hour').innerHTML=hours.map(x=>'<option>'+x+'</option>').join('');$('minute').innerHTML=['00','15','30','45'].map(x=>'<option>'+x+'</option>').join('');function extract(v){v=(v||'').trim();let m=v.match(/https:\/\/meet\.google\.com\/[a-z0-9-]+/i);if(m)return m[0];m=v.match(/https?:\/\/[^\s<>]+/i);return m?m[0].replace(/[),.;]+$/,''):v}function fmt(ms){return new Date(ms).toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false})}function remain(ms){let d=ms-Date.now(),done=d<=0;d=Math.abs(d);let day=Math.floor(d/864e5),h=Math.floor(d%864e5/36e5),m=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1000);return(done?'완료 · ':'')+(day?day+'일 ':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function color(ms){let now=new Date(),t=new Date(ms);if(ms<=Date.now())return['#000','#fff',''];let a=new Date(now.getFullYear(),now.getMonth(),now.getDate()),b=new Date(t.getFullYear(),t.getMonth(),t.getDate()),days=Math.round((b-a)/864e5);if(days===0&&ms-Date.now()<=108e5)return['#B21016','#fff','urgent'];if(days===0)return['#FFFA99','#000',''];return['#BFBFBF','#000','']}function render(){schedules.sort((a,b)=>a.targetTime-b.targetTime);$('cards').innerHTML=schedules.length?schedules.map(x=>{let c=color(x.targetTime);return `<div class="card ${c[2]}" style="background:${c[0]};color:${c[1]}"><div class="title">${esc(x.title)}</div><div class="time">${fmt(x.targetTime)}</div><div class="count">${remain(x.targetTime)}</div><div class="actions">${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">미팅 열기</a>`:''}<button onclick="editItem('${x.id}')">수정</button><button onclick="delItem('${x.id}')">삭제</button></div></div>`}).join(''):'<div class="empty">등록된 일정이 없습니다.</div>'}function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}async function req(url,opt={}){let r=await fetch(url,{...opt,headers:{...H,...(opt.headers||{})}});if(!r.ok)throw new Error((await r.text())||r.statusText);return r.status===204?null:r.json()}async function load(){try{let d=await req(API+'?select=id,title,target_time,url&order=target_time.asc');schedules=d.map(x=>({id:x.id,title:x.title,targetTime:Number(x.target_time),url:x.url||''}));localStorage.setItem('schedules',JSON.stringify(schedules));$('status').textContent='Supabase 온라인 일정과 연결됨';render()}catch(e){let c=JSON.parse(localStorage.getItem('schedules')||'[]');schedules=c;$('status').textContent='온라인 연결 실패: '+e.message+(c.length?' · 저장된 캐시를 표시합니다.':'');render()}}$('form').onsubmit=async e=>{e.preventDefault();let target=new Date($('date').value+'T'+$('hour').value+':'+$('minute').value+':00').getTime();let item={id:editing||crypto.randomUUID(),title:$('title').value.trim(),target_time:target,url:extract($('url').value)};try{if(editing)await req(API+'?id=eq.'+encodeURIComponent(editing),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({title:item.title,target_time:item.target_time,url:item.url,updated_at:new Date().toISOString()})});else await req(API,{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(item)});resetForm();await load()}catch(err){alert('저장 실패: '+err.message)}};window.editItem=id=>{let x=schedules.find(v=>v.id===id);if(!x)return;editing=id;$('title').value=x.title;let d=new Date(x.targetTime),p=n=>String(n).padStart(2,'0');$('date').value=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());$('hour').value=p(d.getHours());$('minute').value=['00','15','30','45'].reduce((a,b)=>Math.abs(+b-d.getMinutes())<Math.abs(+a-d.getMinutes())?b:a);$('url').value=x.url;$('formTitle').textContent='일정 수정';$('submit').textContent='수정 저장';$('cancel').style.display='block';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};window.delItem=async id=>{if(!confirm('이 일정을 삭제할까요?'))return;try{await req(API+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{'Prefer':'return=minimal'}});await load()}catch(e){alert('삭제 실패: '+e.message)}};window.resetForm=()=>{editing=null;$('form').reset();$('hour').value='09';$('minute').value='00';$('formTitle').textContent='일정 등록';$('submit').textContent='일정 등록';$('cancel').style.display='none';let d=new Date();$('date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};window.exportTxt=()=>{let b=new Blob([JSON.stringify(schedules,null,2)],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='schedule-timer-backup.txt';a.click();URL.revokeObjectURL(a.href)};$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw Error('배열 형식이 아닙니다.');if(!confirm('현재 온라인 일정을 TXT 내용으로 교체할까요?'))return;await req(API+'?id=not.is.null',{method:'DELETE',headers:{'Prefer':'return=minimal'}});if(arr.length)await req(API,{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(arr.map(x=>({id:x.id||crypto.randomUUID(),title:x.title,target_time:Number(x.targetTime??x.target_time),url:extract(x.url||'')})))});await load()}catch(err){alert('TXT 불러오기 실패: '+err.message)}finally{e.target.value=''}};resetForm();load();setInterval(render,1000);setInterval(load,60000);</script></body></html>
